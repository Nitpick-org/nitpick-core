name: CI

# The oracle stays ./scripts/check.sh: shared + server tests, desktop and Android
# builds. This workflow only provisions a machine able to run it, so a green run
# here means exactly the same thing as a green run on a laptop.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check.sh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The ubuntu image ships the SDK and pre-accepted licences; AGP then downloads
      # whatever is missing (API 37, build-tools) on first use. android-actions/
      # setup-android is deliberately absent: it still runs `sdkmanager tools`, a
      # package cmdline-tools 16 no longer publishes, and fails on the image.
      - name: Set up Gradle with the build cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run check.sh
        run: ./scripts/check.sh

      # Team lesson: a green build may have executed 0 tests, so count them.
      - name: Prove that tests ran
        run: |
          count=$(grep -rho --include='TEST-*.xml' --exclude-dir=.git 'tests="[0-9]*"' . \
            | grep -o '[0-9]*' | awk '{ n += $1 } END { print n + 0 }')
          echo "Tests executed: $count"
          test "$count" -gt 0

      - name: Keep the debug APK as a submission artefact
        uses: actions/upload-artifact@v4
        with:
          name: nitpick-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
