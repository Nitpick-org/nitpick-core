name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          version: 11
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Require an initialized stack
        run: |
          test -f package.json || {
            echo "::error::No package.json yet. Read docs/STACK.md and initialize the stack before relying on CI."
            exit 1
          }

      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Doctor
        run: ./scripts/doctor.sh

      - name: Check (typecheck + lint + test)
        run: ./scripts/check.sh

      - name: Demo path (if configured)
        run: |
          if node -e "const s=require('./package.json').scripts||{}; process.exit(s.e2e?0:1)"; then
            ./scripts/check.sh --demo
          else
            echo "No e2e script yet; demo path not automated."
          fi
