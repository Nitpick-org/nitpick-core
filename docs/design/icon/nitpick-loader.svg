<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .r, .arm-l, .arm-r, .lift, .dot { transform-box: view-box; }
    .r { stroke-dasharray: 18 82; animation: run 1.6s linear infinite; }
    .arm-l { transform-origin: 234.4px 121px; animation: armL 2.4s cubic-bezier(.65,0,.35,1) infinite; }
    .arm-r { transform-origin: 277.6px 121px; animation: armR 2.4s cubic-bezier(.65,0,.35,1) infinite; }
    .lift { animation: lift 2.4s cubic-bezier(.65,0,.35,1) infinite; }
    .dot { transform-origin: 256px 371px; animation: dot 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes run { to { stroke-dashoffset: -100; } }
    @keyframes armL { 0%, 6% { transform: rotate(5deg); } 18%, 62% { transform: rotate(0deg); } 70%, 100% { transform: rotate(5deg); } }
    @keyframes armR { 0%, 6% { transform: rotate(-5deg); } 18%, 62% { transform: rotate(0deg); } 70%, 100% { transform: rotate(-5deg); } }
    @keyframes lift { 0%, 20% { transform: translateY(0); } 40%, 64% { transform: translateY(-38px); } 90%, 100% { transform: translateY(0); } }
    @keyframes dot {
      0%, 20% { transform: translateY(0) scale(1); }
      40%, 66% { transform: translateY(-38px) scale(1); }
      79% { transform: translateY(0) scale(1.18, .8); }
      85% { transform: translateY(-10px) scale(.95, 1.05); }
      91% { transform: translateY(0) scale(1.06, .94); }
      96%, 100% { transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arm-l, .arm-r, .lift, .dot { animation: none; }
      .r { animation-duration: 4s; }
    }
