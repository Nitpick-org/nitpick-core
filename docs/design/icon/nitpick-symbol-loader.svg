    .shadow { transform-origin: 256px 398px; animation: shadow 2.4s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes armL { 0%, 6% { transform: rotate(5deg); } 18%, 62% { transform: rotate(0deg); } 70%, 100% { transform: rotate(5deg); } }
    @keyframes armR { 0%, 6% { transform: rotate(-5deg); } 18%, 62% { transform: rotate(0deg); } 70%, 100% { transform: rotate(-5deg); } }
