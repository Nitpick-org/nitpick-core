<svg xmlns="http://www.w3.org/2000/svg" viewBox="86 56 340 352" width="340" height="352" role="img" aria-label="Loading" style="color:#0F766E" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .arm-l, .arm-r, .lift, .dot, .shadow { transform-box: view-box; }
    .arm-l { transform-origin: 234.4px 121px; animation: armL 2.4s cubic-bezier(.65,0,.35,1) infinite; }
    .arm-r { transform-origin: 277.6px 121px; animation: armR 2.4s cubic-bezier(.65,0,.35,1) infinite; }
    .lift { animation: lift 2.4s cubic-bezier(.65,0,.35,1) infinite; }
